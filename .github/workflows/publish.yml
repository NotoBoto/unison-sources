name: Publish
# Builds the plugins, signs index.json with the ed25519 key and publishes site/ to GitHub Pages (§6, §19.3).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tests/unit.mjs && node tests/golden.mjs
      - name: Build and sign
        env:
          UNISON_SIGNING_KEY: ${{ secrets.UNISON_SIGNING_KEY }}
        run: |
          test -n "$UNISON_SIGNING_KEY" || { echo "secret UNISON_SIGNING_KEY is not set"; exit 1; }
          node scripts/build.mjs
          test -s site/index.json.sig
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
